<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El Club del Frijol</title>
  <style>
    :root { color-scheme: light dark; --fondo: #FFF4E6; --texto: #5D4037; --acento: #F28C38; }
    @media (prefers-color-scheme: dark) { :root { --fondo: #2B2320; --texto: #FFE2C4; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--fondo); color: var(--texto);
      font-family: system-ui, sans-serif; text-align: center; padding: 16px; }
    img { width: 140px; height: 140px; border-radius: 50%; object-fit: cover; }
    a.boton { display: inline-block; margin-top: 20px; padding: 14px 28px;
      border-radius: 999px; background: var(--acento); color: #fff;
      font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 12px; opacity: .75; }
  </style>
</head>
<body>
  <main>
    <img src="icono.png" alt="">
    <h1>🫘 El Club del Frijol</h1>
    <p>Versión __VERSION__</p>
    <a class="boton" href="apk/club-del-frijol.apk">Descargar para Android</a>
    <small>Si Android pregunta, permite instalar apps de esta fuente.</small>
  </main>
</body>
</html>
